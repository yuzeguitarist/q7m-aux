name: Task

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Payload
        required: true
        type: string
      platform:
        description: Platform
        required: true
        type: choice
        options: [linux, macos]
      group:
        description: Group
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: task-${{ inputs.group }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  execute:
    name: Execute
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && inputs.platform == 'linux'
    environment: ci-relay
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Prepare
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Execute
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          TASK_PLATFORM: ${{ inputs.platform }}
          TASK_GROUP: ${{ inputs.group }}
          CI_RELAY_KEY: ${{ secrets.CI_RELAY_KEY }}
          CI_SOURCE_REPOSITORY: ${{ secrets.CI_SOURCE_REPOSITORY }}
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
          CI_RESULT_PUBLIC_KEY: ${{ secrets.CI_RESULT_PUBLIC_KEY }}
        run: node relay.mjs execute

      - name: Store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload
          path: ${{ runner.temp }}/result/payload.bin
          retention-days: 1
          overwrite: true
          if-no-files-found: error
          compression-level: 0

      - name: Complete
        if: always()
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          TASK_PLATFORM: ${{ inputs.platform }}
          TASK_GROUP: ${{ inputs.group }}
          CI_RELAY_KEY: ${{ secrets.CI_RELAY_KEY }}
          CI_SOURCE_REPOSITORY: ${{ secrets.CI_SOURCE_REPOSITORY }}
          CI_CALLBACK_TOKEN: ${{ secrets.CI_CALLBACK_TOKEN }}
        run: node relay.mjs callback

  execute-part:
    name: Execute ${{ matrix.part }}
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && inputs.platform == 'macos'
    environment: ci-relay
    runs-on: xcode-27
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - name: Prepare
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Execute
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          TASK_PLATFORM: ${{ inputs.platform }}
          TASK_GROUP: ${{ inputs.group }}
          TASK_PART: ${{ matrix.part }}
          CI_RELAY_KEY: ${{ secrets.CI_RELAY_KEY }}
          CI_SOURCE_REPOSITORY: ${{ secrets.CI_SOURCE_REPOSITORY }}
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
        run: node relay.mjs execute-part

      - name: Store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-${{ matrix.part }}
          path: ${{ runner.temp }}/result/part.bin
          retention-days: 1
          overwrite: true
          if-no-files-found: error
          compression-level: 0

  combine:
    name: Combine
    needs: execute-part
    if: always() && github.actor == github.repository_owner && github.ref == 'refs/heads/main' && inputs.platform == 'macos'
    permissions:
      contents: read
      actions: write
    environment: ci-relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare
        id: prepare
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
          merge-multiple: false

      - name: Combine
        id: combine
        if: always() && steps.prepare.outcome == 'success'
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          TASK_PLATFORM: ${{ inputs.platform }}
          TASK_GROUP: ${{ inputs.group }}
          CI_RELAY_KEY: ${{ secrets.CI_RELAY_KEY }}
          CI_SOURCE_REPOSITORY: ${{ secrets.CI_SOURCE_REPOSITORY }}
          CI_RESULT_PUBLIC_KEY: ${{ secrets.CI_RESULT_PUBLIC_KEY }}
        run: node relay.mjs combine

      - name: Store
        if: always() && steps.combine.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload
          path: ${{ runner.temp }}/result/payload.bin
          retention-days: 1
          overwrite: true
          if-no-files-found: error
          compression-level: 0

      - name: Cleanup
        if: always() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node relay.mjs cleanup-parts

      - name: Complete
        if: always()
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          TASK_PLATFORM: ${{ inputs.platform }}
          TASK_GROUP: ${{ inputs.group }}
          CI_RELAY_KEY: ${{ secrets.CI_RELAY_KEY }}
          CI_SOURCE_REPOSITORY: ${{ secrets.CI_SOURCE_REPOSITORY }}
          CI_CALLBACK_TOKEN: ${{ secrets.CI_CALLBACK_TOKEN }}
        run: node relay.mjs callback
